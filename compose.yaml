services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dbadminer
      POSTGRES_PASSWORD: dbadminer
      POSTGRES_DB: dbadminer
    ports:
      - "5432:5432"
  mysql:
    image: mysql:8
    environment:
      MYSQL_USER: dbadminer
      MYSQL_PASSWORD: dbadminer
      MYSQL_DATABASE: dbadminer
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_USER: dbadminer
      MARIADB_PASSWORD: dbadminer
      MARIADB_DATABASE: dbadminer
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
