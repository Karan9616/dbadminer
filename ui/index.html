<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DBAdminer</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header>
    <strong>DBAdminer</strong>
    <span id="meta"></span>
  </header>
  <div id="layout">
    <aside>
      <h1>Tables</h1>
      <ul id="tables"></ul>
    </aside>
    <main>
      <section>
        <h1 id="table-title">Rows</h1>
        <div id="grid"></div>
        <div id="pager">
          <button id="prev" type="button">Previous</button>
          <span id="page"></span>
          <button id="next" type="button">Next</button>
        </div>
      </section>
      <section>
        <h1>SQL</h1>
        <label for="sql">Statement</label>
        <textarea id="sql" rows="5" spellcheck="false"></textarea>
        <button id="run" type="button">Run</button>
        <div id="sql-result"></div>
      </section>
      <p id="status" role="status"></p>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
